<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图1.22 / 1.23 — 发射极旁路电容放大电路</title>
<link rel="stylesheet" href="../assets/circuit.css">
<style>
  .scope-wrap { display:flex; flex-direction:column; gap:10px; }
  .scope-cap { font-size:10px; color:var(--muted); margin-bottom:4px; display:flex; justify-content:space-between; }
  .scope-cap b { font-variant-numeric:tabular-nums; }
  canvas.scope { width:100%; height:58px; display:block; border-radius:4px; background:#070b11; border:1px solid var(--border); }
  .readout { display:flex; flex-direction:column; gap:7px; }
  .ro-row { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .ro-row b { color:var(--green); font-variant-numeric:tabular-nums; }
  .ro-row b.warn { color:var(--warn); }
  .ro-row b.danger { color:var(--danger); }
  #btn-c2.danger:not(.on) { background:#2a1010; border-color:var(--danger); color:var(--danger); box-shadow:0 0 12px #e0505044; }
</style>
</head>
<body>

<h1>图1.22 / 1.23 — 发射极旁路电容放大电路</h1>

<div class="stage">
  <div id="circuit-wrap">
    <svg id="svg" width="600" height="420" viewBox="0 0 600 420"></svg>
  </div>

  <div class="panel">
    <div>
      <div class="panel-title">示波器</div>
      <div class="scope-wrap">
        <div>
          <div class="scope-cap"><span>输入信号 Uᵢ</span><b id="lab-in" style="color:var(--warn)">~10 mV</b></div>
          <canvas class="scope" id="scope-in" width="320" height="58"></canvas>
        </div>
        <div>
          <div class="scope-cap"><span>输出信号 Uₒ</span><b id="lab-out">放大 ✓</b></div>
          <canvas class="scope" id="scope-out" width="320" height="58"></canvas>
        </div>
      </div>
    </div>

    <div>
      <div class="panel-title">测量读数</div>
      <div class="readout">
        <div class="ro-row"><span>集电极电流 I_C</span><b id="ro-ic">3.58 mA</b></div>
        <div class="ro-row"><span>射极交流 U_e~</span><b id="ro-ue">≈ 0 mV</b></div>
        <div class="ro-row"><span>输出交流 U_o~</span><b id="ro-uo">0.81 V</b></div>
        <div class="ro-row"><span>电压增益 A_v</span><b id="ro-av">高（≈ R_C/rₑ）</b></div>
      </div>
    </div>

    <div>
      <div class="panel-title">电路状态</div>
      <div id="st-amp" class="status-item"><div class="status-dot"></div><span>三极管放大交流信号</span></div>
      <div id="st-byp" class="status-item"><div class="status-dot"></div><span>C₂ 把射极交流旁路到地</span></div>
      <div id="st-fb"  class="status-item danger"><div class="status-dot"></div><span>射极负反馈，增益骤降</span></div>
    </div>

    <div>
      <div class="panel-title">操作</div>
      <button class="btn on danger" id="btn-c2">旁路电容 C₂：接入</button>
    </div>

    <div>
      <div class="panel-title">说明</div>
      <div class="stage-note" id="note">射极电流 Iₑ 有两条路：R₄ 和 C₂。对交流而言电容阻抗远小于电阻，<br>交流优先走 C₂ 旁路到地 → 射极交流≈0、增益高（图1.22）。</div>
    </div>
  </div>
</div>

<script src="../assets/circuit-kit.js?v=14"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const $ = id => document.getElementById(id);
svg.innerHTML = Circuit.defs();
const c = new Circuit(svg);

const VCC = 70, GND = 370;

// ── place components ──
const AC = c.acSource(55, 215, { label: 'Uₛ' });                              // out[87,215] gnd[55,249]
const R5 = c.resistor(125, 215, { label: 'R₅', value: '1k', dir: 'h' });       // a[95,215] b[155,215]
const C1 = c.capacitor(195, 215, { label: 'C₁', dir: 'h' });                   // a[170,215] b[220,215]
const Q  = c.transistor(320, 215, { label: 'Q₁', sub: '2N5210' });             // base[294,215] col[330,179] emi[330,251]
const R2 = c.resistor(245, 140, { label: 'R₂', value: '31k' });                // a[245,110] b[245,170]
const R3 = c.resistor(245, 300, { label: 'R₃', value: '20k' });                // a[245,270] b[245,330]
const R1 = c.resistor(Q.collector[0], 135, { label: 'R₁', value: '1.5k' });    // a[330,105] b[330,165]
const C3 = c.capacitor(390, Q.collector[1], { label: 'C₃', dir: 'h' });        // a[365,179] b[415,179]
const R6 = c.resistor(450, 250, { label: 'R₆', value: '1k' });                 // a[450,220] b[450,280]
const R4 = c.resistor(300, 305, { label: 'R₄', value: '1k' });                 // a[300,275] b[300,335]
const C2 = c.capacitor(380, 305, { label: 'C₂' }); const C2g = c.partLayer.lastChild;  // a[380,280] b[380,330]
const DC = c.source(540, 210, {});                                             // pos[540,190] neg[540,230]

const bn = [245, 215];                 // base node
const col = Q.collector, emi = Q.emitter;
const out = [R6.a[0], col[1]];         // output node [450,179]

// ── wiring ──
// input chain
c.wire(AC.out, R5.a);
c.wire(R5.b, C1.a);
c.wire(C1.b, bn); c.wire(bn, Q.base); c.node(bn);
c.wire(AC.gnd, [AC.gnd[0], GND]);
// base bias divider
c.wire([bn[0], VCC], R2.a); c.wire(R2.b, bn);
c.wire(bn, R3.a); c.wire(R3.b, [bn[0], GND]);
// collector
c.wire(col, R1.b); c.wire(R1.a, [col[0], VCC]); c.node(col);
// output coupling + load
c.wire(col, C3.a); c.wire(C3.b, out); c.node(out);
c.wire(out, R6.a); c.wire(R6.b, [R6.a[0], GND]);
// emitter → R4 ∥ C2 → GND
c.wire(emi, [R4.a[0], emi[1]]); c.wire([R4.a[0], emi[1]], R4.a); c.node(emi);
c.wire(R4.b, [R4.a[0], GND]);
c.wire(emi, [C2.a[0], emi[1]]); c.wire([C2.a[0], emi[1]], C2.a);
c.wire(C2.b, [C2.a[0], GND]);
// supply
c.wire(DC.pos, [DC.pos[0], VCC]); c.wire(DC.neg, [DC.neg[0], GND]);
// rails
c.wire([bn[0], VCC], [DC.pos[0], VCC]);
c.wire([AC.gnd[0], GND], [DC.neg[0], GND]);
// rail junction dots
c.node([bn[0], VCC]); c.node([col[0], VCC]);
c.node([R3.b[0], GND]); c.node([R4.a[0], GND]); c.node([C2.a[0], GND]); c.node([R6.a[0], GND]);

// ── extra labels ──
function sText(x, y, s, fill, size, anchor) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('fill', fill);
  t.setAttribute('font-size', size || 9); t.setAttribute('text-anchor', anchor || 'middle');
  t.setAttribute('font-family', "'Courier New',monospace"); t.textContent = s;
  svg.appendChild(t); return t;
}
sText(DC.pos[0] + 4, VCC - 6, '+V', '#f5a623', 11, 'start');
sText(195, 238, '1μF', '#4a7aaa', 9);   // C1
sText(378, 200, '1μF', '#4a7aaa', 9);   // C3
sText(380, 348, '1μF', '#4a7aaa', 9);   // C2

c.fit(16, 1.0);

// ── DC bias current (steady, dim green) ──
const dc = c.particles([DC.pos, [DC.pos[0], VCC], [col[0], VCC], col, emi, [R4.a[0], emi[1]], [R4.a[0], GND], [DC.neg[0], GND], DC.neg]);
dc.set({ on: true, color: '#1a6b3a', speed: 0.6 });

// ── AC signal particles ──
const pIn  = c.particles([AC.out, R5.a, R5.b, C1.a, C1.b, bn, Q.base]);
const pOut = c.particles([col, C3.a, C3.b, out, R6.a, [R6.a[0], GND]]);
const pByp = c.particles([emi, [C2.a[0], emi[1]], C2.a, C2.b, [C2.a[0], GND]]);
const pR4  = c.particles([emi, [R4.a[0], emi[1]], R4.a, R4.b, [R4.a[0], GND]]);

// signal-path highlight segments
const outPath = [ col, [out[0], col[1]], [R6.a[0], GND] ];
const bypPath = [ emi, [C2.a[0], emi[1]], [C2.a[0], GND] ];
const r4Path  = [ emi, [R4.a[0], emi[1]], [R4.a[0], GND] ];

// ── state ──
let c2on = true, t = 0;
Q.setActive(true);

function refresh() {
  // readouts (book values)
  $('ro-ic').textContent  = c2on ? '3.58 mA' : '4.10 mA';
  $('ro-ue').textContent  = c2on ? '≈ 0 mV' : '≈ 跟随输入';
  $('ro-ue').className     = c2on ? '' : 'warn';
  $('ro-uo').textContent  = c2on ? '0.81 V' : '0.01 V';
  $('ro-uo').className     = c2on ? '' : 'danger';
  $('ro-av').textContent  = c2on ? '高（≈ R_C/rₑ）' : '低（≈ R_C/R₄）';
  $('ro-av').className     = c2on ? '' : 'danger';
  // status
  $('st-amp').classList.add('active');
  $('st-byp').classList.toggle('active', c2on);
  $('st-fb').classList.toggle('active', !c2on);
  // dim C2 when removed
  C2g.style.opacity = c2on ? 1 : 0.22;
  // particles
  pByp.set({ on: c2on, color: '#f5a623', speed: 1.6 });
  pR4.set({ on: !c2on, color: '#f5a623', speed: 0.8 });
  pIn.set({ on: true, color: '#f5a623', speed: 1.2 });
  pOut.set({ on: true, color: c2on ? '#f5a623' : '#5a6b7d', speed: c2on ? 1.5 : 0.5 });
  // highlight
  c.lightPaths(c2on ? [outPath, bypPath] : [r4Path], c2on ? '#f5a623' : '#e05050');
  // labels / note
  $('lab-out').textContent = c2on ? '放大 ✓' : '几乎无放大';
  $('lab-out').style.color = c2on ? 'var(--green)' : 'var(--danger)';
  if (c2on) {
    $('note').className = 'stage-note';
    $('note').innerHTML = '射极电流 Iₑ 有两条路：R₄ 和 C₂。对交流而言电容阻抗远小于电阻，<br>交流优先走 C₂ 旁路到地 → 射极交流≈0、增益高（图1.22）。';
  } else {
    $('note').className = 'stage-note danger';
    $('note').innerHTML = '去掉 C₂ 后，射极交流只能走 R₄ → 射极产生交流压降形成负反馈，<br>抵消了大部分输入 → 电压增益骤降，输出几乎不放大（图1.23）。';
  }
}

$('btn-c2').addEventListener('click', function () {
  c2on = !c2on; this.classList.toggle('on', c2on);
  this.textContent = '旁路电容 C₂：' + (c2on ? '接入' : '断开');
  refresh();
});

// ── oscilloscope ──
const sIn = $('scope-in').getContext('2d');
const sOut = $('scope-out').getContext('2d');
const SW = 320, SH = 58, MID = SH / 2;
const inBuf = new Array(SW).fill(MID), outBuf = new Array(SW).fill(MID);

function drawScope(ctx, buf, color) {
  ctx.fillStyle = '#070b11'; ctx.fillRect(0, 0, SW, SH);
  ctx.strokeStyle = '#10202c'; ctx.lineWidth = 0.5;
  for (let x = 0; x < SW; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SH); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(0, MID); ctx.lineTo(SW, MID); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
  buf.forEach((v, i) => i === 0 ? ctx.moveTo(i, v) : ctx.lineTo(i, v));
  ctx.stroke();
}

function frame() {
  t += 0.18;
  const inAmp = 7;
  const sig = Math.sin(t);
  inBuf.push(MID - sig * inAmp); inBuf.shift();
  // output: inverted (180°), large with C2 / tiny without
  const outAmp = c2on ? 23 : 1.5;
  outBuf.push(MID + sig * outAmp); outBuf.shift();
  drawScope(sIn, inBuf, '#f5a623');
  drawScope(sOut, outBuf, c2on ? '#22d36a' : '#e05050');
  requestAnimationFrame(frame);
}

refresh();
frame();
</script>
</body>
</html>
